<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="color-scheme" content="dark">
  <title>AURA MUSIC 2.0 — The premium music ecosystem</title>
  <meta name="description" content="Search real music, play with a cinematic player, enjoy word-synced LyricsPlay, build playlists and get the verified AURA MUSIC Android app.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="AURA MUSIC 2.0">
  <meta property="og:description" content="A premium, AMOLED music ecosystem in your browser.">
  <meta property="og:image" content="./og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/player.css">
  <link rel="stylesheet" href="./styles/lyrics.css">
  <link rel="stylesheet" href="./styles/premium.css">
  <script src="./config.js?v=2.0.13"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app-shell" id="app">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/home" aria-label="AURA MUSIC home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-word">AURA<span>MUSIC</span><small>2.0</small></span>
      </a>

      <nav class="side-nav" id="sideNav">
        <a href="#/home" data-nav="home" class="nav-item" title="Home" aria-label="Home"><span data-icon="home"></span><span class="nav-label">Home</span></a>
        <a href="#/search" data-nav="search" class="nav-item" title="Search" aria-label="Search"><span data-icon="search"></span><span class="nav-label">Search</span></a>
        <a href="#/library" data-nav="library" class="nav-item" title="Your library" aria-label="Your library"><span data-icon="library"></span><span class="nav-label">Your library</span></a>
        <div class="nav-divider"></div>
        <a href="#/musicflow" data-nav="musicflow" class="nav-item" title="Music Flow" aria-label="Music Flow"><span data-icon="flow"></span><span class="nav-label">Music Flow</span></a>
        <a href="#/mood" data-nav="mood" class="nav-item" title="AI Mood Radio" aria-label="AI Mood Radio"><span data-icon="sparkles"></span><span class="nav-label">Mood Radio</span></a>
        <a href="#/video" data-nav="video" class="nav-item" title="Videos" aria-label="Videos"><span data-icon="video"></span><span class="nav-label">Videos</span></a>
        <a href="#/downloads" data-nav="downloads" class="nav-item" title="Offline &amp; files" aria-label="Offline &amp; files"><span data-icon="download"></span><span class="nav-label">Offline &amp; files</span></a>
        <a href="#/lyrics" data-nav="lyrics" class="nav-item" title="LyricsPlay" aria-label="LyricsPlay"><span data-icon="lyrics"></span><span class="nav-label">LyricsPlay</span></a>
      </nav>

      <div class="side-playlists" id="sidePlaylists">
        <div class="side-label"><span class="side-label-text">PLAYLISTS</span> <a href="#/library?tab=playlists" aria-label="Manage playlists" data-icon="plus"></a></div>
        <div id="playlistLinks"></div>
      </div>

      <div class="side-foot">
        <a href="#/download" data-nav="download" class="apk-cta" title="Get Android app" aria-label="Get Android app"><span data-icon="download"></span><span class="apk-copy">Get Android app<small>v1.4.6 · signed APK</small></span></a>
        <a href="#/settings" data-nav="settings" class="nav-item" title="Settings" aria-label="Settings"><span data-icon="settings"></span><span class="nav-label">Settings</span></a>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="history-buttons">
          <button type="button" class="icon-btn" id="backBtn" aria-label="Go back" data-icon="chevronLeft"></button>
          <button type="button" class="icon-btn" id="forwardBtn" aria-label="Go forward" data-icon="chevronRight"></button>
        </div>
        <form class="top-search" id="topSearch" role="search">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="topSearchInput" type="search" placeholder="Search songs, artists, moods…" aria-label="Search AURA catalog" autocomplete="off" enterkeyhint="search">
          <kbd>/</kbd>
        </form>
        <div class="top-actions">
          <span class="backend-pill" id="backendPill" title="Backend connection"><i></i><span>CONNECTING</span></span>
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Cycle LyricsPlay look" data-icon="sparkles"></button>
          <a href="#/download" class="top-apk" aria-label="Get Android app"><span data-icon="download" data-icon-size="14"></span><span>APK</span></a>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1" aria-live="polite"></main>

      <footer class="view-foot">
        <span>AURA MUSIC 2.0 · real catalog via authorized providers</span>
        <span><a href="./privacy.html" target="_blank" rel="noopener">Privacy</a> · <a href="./terms.html" target="_blank" rel="noopener">Terms</a></span>
      </footer>
    </div>

    <nav class="bottom-nav" aria-label="Mobile navigation">
      <a href="#/home" data-nav="home"><span data-icon="home"></span><small>Home</small></a>
      <a href="#/search" data-nav="search"><span data-icon="search"></span><small>Search</small></a>
      <a href="#/library" data-nav="library"><span data-icon="library"></span><small>Library</small></a>
      <a href="#/mood" data-nav="mood"><span data-icon="sparkles"></span><small>Mood</small></a>
      <a href="#/lyrics" data-nav="lyrics"><span data-icon="lyrics"></span><small>Lyrics</small></a>
      <a href="#/download" data-nav="download"><span data-icon="download"></span><small>APK</small></a>
    </nav>
  </div>

  <div class="mini-player" id="miniPlayer" hidden></div>

  <section class="player-overlay" id="playerOverlay" aria-label="Full screen player" hidden></section>

  <section class="lyrics-overlay" id="lyricsOverlay" role="dialog" aria-modal="true" aria-label="LyricsPlay" tabindex="-1" hidden></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="loading-veil" id="loadingVeil" aria-hidden="true"><span></span></div>

  <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>

  <noscript><div class="noscript">AURA MUSIC 2.0 needs JavaScript to search and play music.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
