name: Keep AURA API warm

# Render's free instance sleeps after inactivity. A short health ping every
# five minutes keeps the first real search/stream request from cold-starting.
# No repository secrets are needed: /api/health is public and returns no data.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: aura-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 25 https://aura-music-2-0-api.onrender.com/api/health; then
              echo "AURA API is warm"
              exit 0
            fi
            sleep 5
          done
          echo "AURA API did not answer; the app will retry from the browser"
          exit 0
