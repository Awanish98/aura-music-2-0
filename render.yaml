services:
  - type: web
    name: aura-music-2-0-api
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AURA_BIND
        value: 0.0.0.0
      - key: AURA_PORT
        value: 10000
      - key: AURA_WEB_ROOT
        value: /app/website
      - key: AURA_ALLOWED_ORIGIN
        value: "*"
      - key: AURA_RELEASE_BASE
        value: https://github.com/Awanish98/aura-music-2-0/releases/download/v1.4.6
      # Secret is supplied in the Render dashboard / Blueprint environment.
      # sync:false keeps the value out of the repository and out of git history.
      - key: GROQ_API_KEY
        sync: false
